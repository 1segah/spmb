<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Pentagon / Shield -->
  <polygon points="100,8 188,40 162,156 100,192 38,156 12,40" fill="url(#gradPrimary)" filter="url(#shadow)" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Inner Border Line -->
  <polygon points="100,18 176,46 154,148 100,180 46,148 24,46" fill="none" stroke="url(#gradGold)" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- Center Circle Background -->
  <circle cx="100" cy="95" r="54" fill="#ffffff" />
  <circle cx="100" cy="95" r="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>

  <!-- Education Torch / Obor Pendidikan -->
  <!-- Torch Handle -->
  <path d="M96 112 L104 112 L102 134 L98 134 Z" fill="#64748b" />
  <path d="M93 110 L107 110 L105 116 L95 116 Z" fill="#d97706" />
  <!-- Flames -->
  <path d="M100 70 C108 80 114 88 106 104 C100 98 94 104 90 95 C88 88 94 80 100 70 Z" fill="url(#gradGold)" />
  <path d="M100 78 C104 84 107 89 102 98 C98 94 95 98 93 92 C92 87 96 82 100 78 Z" fill="#ef4444" opacity="0.85" />

  <!-- Open Book Beneath Torch -->
  <path d="M100 125 C88 116 72 118 64 123 L64 135 C72 130 88 128 100 137 C112 128 128 130 136 135 L136 123 C128 118 112 116 100 125 Z" fill="#0284c7" />
  <path d="M100 125 L100 137" stroke="#ffffff" stroke-width="2" />

  <!-- 3 Stars on top -->
  <polygon points="100,48 102,53 107,53 103,56 105,61 100,58 95,61 97,56 93,53 98,53" fill="url(#gradGold)"/>
  <polygon points="82,53 84,57 88,57 85,59 86,63 82,60 78,63 80,59 76,57 80,57" fill="url(#gradGold)"/>
  <polygon points="118,53 120,57 124,57 121,59 122,63 118,60 114,63 116,59 112,57 116,57" fill="url(#gradGold)"/>

  <!-- Ribbon for School Name -->
  <path d="M30 152 L170 152 L158 174 L42 174 Z" fill="url(#gradGold)" filter="url(#shadow)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="100" y="167" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#0f172a" letter-spacing="1">SMPN 1 SEGAH</text>

  <!-- Small Year Text -->
  <text x="100" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="1">BERAU - KALTIM</text>
</svg>
